name: Install upstream Litestream for tests
description: Install the Go CLI used by Rust SQLite test fixtures; the runtime embeds terse-litestream through Cargo.
runs:
    using: composite
    steps:
        - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
          with:
              go-version: "1.27.1"
              cache: false
        - shell: bash
          run: go install github.com/benbjohnson/litestream/cmd/litestream@v0.5.17
