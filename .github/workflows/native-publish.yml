name: Publish native runtimes

on:
    workflow_call:
        inputs:
            runners:
                type: string
                default: '["blacksmith-4vcpu-ubuntu-2204", "blacksmith-4vcpu-ubuntu-2204-arm", "blacksmith-6vcpu-macos-15"]'
            version:
                type: string
                required: true

permissions:
    contents: write

jobs:
    publish:
        name: Verify and publish native runtime (${{ matrix.runner }})
        strategy:
            fail-fast: false
            matrix:
                runner: ${{ fromJSON(inputs.runners) }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: native-${{ matrix.runner }}
                  path: dist-runtime
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: sdk-package
                  path: .artifacts
            - run: bun install --frozen-lockfile
            - name: Check the packaged SDK and native bundle
              env:
                  DURABLE_ACTORS_TEST_PACKAGE: ${{ github.workspace }}/.artifacts/durable-actors-${{ inputs.version }}.tgz
                  DURABLE_ACTORS_TEST_OBSERVER_PACKAGE: ${{ github.workspace }}/.artifacts/durable-actors-observer-${{ inputs.version }}.tgz
              run: |
                  bun test --timeout 60000 tests/scripts/build-runtime.test.mjs
                  bun pm pkg set "overrides.durable-actors-observer=file:$DURABLE_ACTORS_TEST_OBSERVER_PACKAGE"
                  bun add --cwd examples/chat --ignore-scripts "$DURABLE_ACTORS_TEST_PACKAGE"
                  bun run --bun --cwd examples/chat durable-actors generate src/actors.ts
                  bun run --bun --cwd examples/chat build
            - name: Upload native bundles and checksums
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: gh release upload "$RELEASE_TAG" dist-runtime/*.tar.gz dist-runtime/*.sha256 --clobber
