name: Release

on:
    release:
        types: [published]

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

env:
    REGISTRY: us-central1-docker.pkg.dev
    IMAGE: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/durable-actors

jobs:
    preflight:
        name: Preflight
        if: github.event.release.prerelease == false
        runs-on: blacksmith-2vcpu-ubuntu-2404
        outputs:
            version: ${{ steps.version.outputs.version }}
            ltx-revision: ${{ steps.dependencies.outputs.ltx-revision }}
            ltx-version: ${{ steps.dependencies.outputs.ltx-version }}
            litestream-revision: ${{ steps.dependencies.outputs.litestream-revision }}
            litestream-version: ${{ steps.dependencies.outputs.litestream-version }}
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - name: Read release version
              id: version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::Tag must look like v1.2.3 (got '$TAG')"
                      exit 1
                  fi
                  echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

            - name: Checkout the tagged commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - name: Assert the tagged commit is on main
              run: |
                  git fetch --quiet origin main
                  if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
                      echo "::error::${{ github.sha }} is not an ancestor of origin/main"
                      exit 1
                  fi

            - name: Assert every manifest matches the tag
              run: bun scripts/release.mjs verify "${{ steps.version.outputs.version }}"

            - name: Read the pinned Rust dependencies
              id: dependencies
              run: |
                  python3 - <<'PYTHON'
                  import os, re, tomllib
                  from pathlib import Path

                  dependencies = tomllib.loads(Path("Cargo.toml").read_text())["dependencies"]
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      for name in ("ltx", "litestream"):
                          dependency = dependencies[f"terse-{name}"]
                          assert dependency["git"] == f"https://github.com/TerseAI/terse-{name}"
                          assert re.fullmatch(r"[0-9a-f]{40}", dependency["rev"])
                          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", dependency["version"])
                          print(f"{name}-revision={dependency['rev']}", file=output)
                          print(f"{name}-version={dependency['version']}", file=output)
                  PYTHON

    ltx:
        name: Validate and publish LTX dependency
        needs: preflight
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 15
        steps:
            - name: Checkout the pinned LTX source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: TerseAI/terse-ltx
                  ref: ${{ needs.preflight.outputs.ltx-revision }}
                  persist-credentials: false

            # Validates terse-ltx at its own rust-version.
            - name: Install Rust toolchain
              run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy && rustup default 1.89.0

            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: "1.24.0"
                  cache-dependency-path: tests/oracle/go.sum

            - name: Validate the pinned crate and Go compatibility
              env:
                  LTX_VERSION: ${{ needs.preflight.outputs.ltx-version }}
              run: |
                  python3 - <<'PYTHON'
                  import os, tomllib
                  from pathlib import Path

                  package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
                  assert package["name"] == "terse-ltx"
                  assert package["version"] == os.environ["LTX_VERSION"]
                  PYTHON
                  cargo fmt --all -- --check
                  cargo clippy --all-targets --locked -- -D warnings
                  cargo test --locked -- --include-ignored
                  cargo publish --locked --dry-run

            - name: Publish terse-ltx
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                  LTX_VERSION: ${{ needs.preflight.outputs.ltx-version }}
              run: |
                  status=$(curl -sS \
                    --user-agent "durable-actors-release/1.0 (+https://github.com/TerseAI/durable-actors)" \
                    -o /dev/null \
                    -w "%{http_code}" \
                    "https://crates.io/api/v1/crates/terse-ltx/$LTX_VERSION")
                  if [ "$status" = "200" ]; then
                      echo "terse-ltx@$LTX_VERSION already published"
                  elif [ "$status" = "404" ]; then
                      cargo publish --locked --no-verify
                  else
                      echo "::error::crates.io returned HTTP $status"
                      exit 1
                  fi

    litestream:
        name: Validate and publish embedded capture dependency
        needs: [preflight, ltx]
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 20
        steps:
            - name: Checkout the pinned Litestream source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: TerseAI/terse-litestream
                  ref: ${{ needs.preflight.outputs.litestream-revision }}
                  persist-credentials: false
            # Validates terse-litestream at its own rust-version.
            - name: Install Rust toolchain
              run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy && rustup default 1.89.0
            - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: "1.27.1"
                  cache: false
            - name: Validate capture and upstream compatibility
              env:
                  LITESTREAM_VERSION: ${{ needs.preflight.outputs.litestream-version }}
              run: |
                  python3 - <<'PYTHON'
                  import os, tomllib
                  from pathlib import Path

                  package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
                  assert package["name"] == "terse-litestream"
                  assert package["version"] == os.environ["LITESTREAM_VERSION"]
                  PYTHON
                  scripts/verify.sh
                  cargo publish --locked --dry-run
            - name: Publish terse-litestream
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                  LITESTREAM_VERSION: ${{ needs.preflight.outputs.litestream-version }}
              run: |
                  status=$(curl -sS \
                    --user-agent "durable-actors-release/1.0 (+https://github.com/TerseAI/durable-actors)" \
                    -o /dev/null -w "%{http_code}" \
                    "https://crates.io/api/v1/crates/terse-litestream/$LITESTREAM_VERSION")
                  if [ "$status" = "200" ]; then
                      echo "terse-litestream@$LITESTREAM_VERSION already published"
                  elif [ "$status" = "404" ]; then
                      cargo publish --locked --no-verify
                  else
                      echo "::error::crates.io returned HTTP $status"
                      exit 1
                  fi

    rust:
        name: Test Rust runtime
        needs: [preflight, litestream]
        runs-on: blacksmith-4vcpu-ubuntu-2404
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: durable_actors_test
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d durable_actors_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - name: Checkout the tagged commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}

            - name: Install Rust toolchain
              run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt && rustup default 1.91.0

            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
              with:
                  shared-key: validation-ubuntu-24.04
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - uses: ./.github/actions/setup-test-litestream
            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run tests
              env:
                  DURABLE_ACTORS_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/durable_actors_test?sslmode=disable
              run: cargo test --locked --no-fail-fast

            - name: Verify crate package
              run: cargo publish --locked --dry-run

            - run: bun install --frozen-lockfile
            - run: bun run --bun --cwd sdk build
            - run: cargo build --locked
            - name: Run WebSocket and restart integration tests
              run: cargo test --locked -- --ignored

    npm-ci:
        name: Test npm package
        needs: preflight
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - name: Checkout the tagged commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting
              run: bun run --bun --cwd sdk format:check

            - name: Run tests
              run: bun run --bun --cwd packages/observer-ui test && bun run --bun --cwd sdk test && bun run --bun --cwd packages/observer-ui package:check

            - name: Check and pack the tested npm packages
              run: |
                  bun run --bun --cwd sdk package:check
                  bun pm --cwd packages/observer-ui pack --ignore-scripts --destination ../../dist-tarballs
                  bun pm --cwd sdk pack --ignore-scripts --destination ../dist-tarballs
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sdk-package
                  path: dist-tarballs/*.tgz
                  if-no-files-found: error
                  retention-days: 7

    python-ci:
        needs: preflight
        uses: ./.github/workflows/python.yml

    native:
        needs: preflight
        uses: ./.github/workflows/native-build.yml
        with:
            # Blacksmith macOS runners are ARM64; only releases build on GitHub's slow Intel runner.
            runners: '["blacksmith-4vcpu-ubuntu-2204", "blacksmith-4vcpu-ubuntu-2204-arm", "blacksmith-6vcpu-macos-15", "macos-15-intel"]'

    native-publish:
        name: Verify and publish native runtime (${{ matrix.runner }})
        needs: [preflight, rust, npm-ci, python-ci, native]
        strategy:
            fail-fast: false
            matrix:
                runner: [blacksmith-4vcpu-ubuntu-2204, blacksmith-4vcpu-ubuntu-2204-arm, blacksmith-6vcpu-macos-15, macos-15-intel]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        permissions:
            contents: write
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: native-${{ matrix.runner }}
                  path: dist-runtime
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: sdk-package
                  path: .artifacts
            - run: bun install --frozen-lockfile
            - name: Check the packaged SDK and native bundle
              env:
                  DURABLE_ACTORS_TEST_PACKAGE: ${{ github.workspace }}/.artifacts/durable-actors-${{ needs.preflight.outputs.version }}.tgz
                  DURABLE_ACTORS_TEST_OBSERVER_PACKAGE: ${{ github.workspace }}/.artifacts/durable-actors-observer-${{ needs.preflight.outputs.version }}.tgz
              run: |
                  bun test --timeout 60000 tests/scripts/build-runtime.test.mjs
                  bun pm pkg set "overrides.durable-actors-observer=file:$DURABLE_ACTORS_TEST_OBSERVER_PACKAGE"
                  bun add --cwd examples/chat --ignore-scripts "$DURABLE_ACTORS_TEST_PACKAGE"
                  bun run --bun --cwd examples/chat durable-actors generate src/actors.ts
                  bun run --bun --cwd examples/chat build
            - name: Upload native bundles and checksums
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: gh release upload "$RELEASE_TAG" dist-runtime/*.tar.gz dist-runtime/*.sha256 --clobber

    image-build:
        name: Build runtime image (${{ matrix.target }}, ${{ matrix.arch }})
        needs: preflight
        strategy:
            fail-fast: false
            matrix:
                target: [control-plane, typescript, python]
                arch: [amd64, arm64]
                include:
                    - arch: amd64
                      platform: linux/amd64
                      runner: blacksmith-4vcpu-ubuntu-2404
                    - arch: arm64
                      platform: linux/arm64
                      runner: blacksmith-4vcpu-ubuntu-2404-arm
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}

            - name: Set up Blacksmith Docker builder
              uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
              with:
                  cache-key: durable-actors/runtime-${{ matrix.arch }}
                  nofallback: true
                  platforms: ${{ matrix.platform }}

            - name: Build runtime image
              uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
              with:
                  context: .
                  target: ${{ matrix.target }}
                  platforms: ${{ matrix.platform }}
                  outputs: type=docker,dest=${{ runner.temp }}/runtime-image.tar
                  tags: ${{ env.IMAGE }}:${{ needs.preflight.outputs.version }}-${{ matrix.target }}-${{ matrix.arch }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/TerseAI/durable-actors
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
                      org.opencontainers.image.licenses=MIT

            - name: Check the release image runtime
              env:
                  IMAGE_ARCH_TAG: ${{ env.IMAGE }}:${{ needs.preflight.outputs.version }}-${{ matrix.target }}-${{ matrix.arch }}
              run: |
                  docker load --input "${{ runner.temp }}/runtime-image.tar"
                  bash scripts/test-runtime-image.sh "$IMAGE_ARCH_TAG" "${{ matrix.target }}"

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: runtime-image-${{ matrix.target }}-${{ matrix.arch }}
                  path: ${{ runner.temp }}/runtime-image.tar
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 1

    image-push:
        name: Push runtime image (${{ matrix.target }}, ${{ matrix.arch }})
        needs: [preflight, rust, npm-ci, python-ci, image-build]
        strategy:
            fail-fast: false
            matrix:
                target: [control-plane, typescript, python]
                arch: [amd64, arm64]
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 15
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  project_id: fluid-analogy-473415-c2
                  workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: runtime-image-${{ matrix.target }}-${{ matrix.arch }}
                  path: ${{ runner.temp }}/runtime-image
            - name: Push the validated image
              env:
                  VERSION: ${{ needs.preflight.outputs.version }}
                  ARCH: ${{ matrix.arch }}
                  TARGET: ${{ matrix.target }}
              run: |
                  docker load --input "$RUNNER_TEMP/runtime-image/runtime-image.tar"
                  docker push "${IMAGE}:${VERSION}-${TARGET}-${ARCH}"

    image:
        name: Publish runtime image
        outputs:
            control-plane-digest: ${{ steps.manifest.outputs.control-plane-digest }}
            typescript-digest: ${{ steps.manifest.outputs.typescript-digest }}
            python-digest: ${{ steps.manifest.outputs.python-digest }}
        needs: [preflight, image-push]
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 10
        permissions:
            attestations: write
            contents: read
            id-token: write
        steps:
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  project_id: fluid-analogy-473415-c2
                  workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

            - name: Publish multi-platform manifest
              id: manifest
              env:
                  VERSION: ${{ needs.preflight.outputs.version }}
              run: |
                  set -euo pipefail
                  for target in control-plane typescript python; do
                      docker buildx imagetools create \
                        --tag "${IMAGE}:${VERSION}-${target}" \
                        --tag "${IMAGE}:latest-${target}" \
                        "${IMAGE}:${VERSION}-${target}-amd64" \
                        "${IMAGE}:${VERSION}-${target}-arm64"
                      inspection="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}-${target}")"
                      digest="$(awk '/^Digest:/ { print $2; exit }' <<< "$inspection")"
                      if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                          echo "::error::Could not resolve the published $target manifest digest"
                          exit 1
                      fi
                      echo "${target}-digest=${digest}" >> "$GITHUB_OUTPUT"
                  done

            - name: Attest control-plane image provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-name: ${{ env.IMAGE }}
                  subject-digest: ${{ steps.manifest.outputs.control-plane-digest }}

            - name: Attest typescript image provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-name: ${{ env.IMAGE }}
                  subject-digest: ${{ steps.manifest.outputs.typescript-digest }}

            - name: Attest python image provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-name: ${{ env.IMAGE }}
                  subject-digest: ${{ steps.manifest.outputs.python-digest }}

    helm:
        name: Publish Helm chart
        needs: [preflight, image]
        permissions:
            contents: write
            packages: write
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install Helm
              run: |
                  curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
                  curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
                  sha256sum --check helm-v3.19.0-linux-amd64.tar.gz.sha256sum
                  tar -xzf helm-v3.19.0-linux-amd64.tar.gz
                  sudo install linux-amd64/helm /usr/local/bin/helm
            - name: Pin the published runtime images
              env:
                  CONTROL_PLANE_DIGEST: ${{ needs.image.outputs.control-plane-digest }}
                  TYPESCRIPT_DIGEST: ${{ needs.image.outputs.typescript-digest }}
                  PYTHON_DIGEST: ${{ needs.image.outputs.python-digest }}
              run: bun scripts/pin-chart-image.mjs "$CONTROL_PLANE_DIGEST" "$TYPESCRIPT_DIGEST" "$PYTHON_DIGEST"
            - run: helm lint charts/durable-actors -f charts/durable-actors/tests/values.yaml
            - run: bun test --timeout 60000 charts/durable-actors/tests/chart.test.mjs tests/scripts/chart-image.test.mjs tests/scripts/python-release.test.mjs
            - run: helm package charts/durable-actors --destination .artifacts/charts
            - name: Publish the chart to OCI
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_ACTOR: ${{ github.actor }}
              run: |
                  echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
                  helm push .artifacts/charts/durable-actors-*.tgz oci://ghcr.io/terseai/charts
            - name: Upload the validated Helm chart
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: gh release upload "$RELEASE_TAG" .artifacts/charts/*.tgz --clobber

    npm:
        name: Publish npm packages
        needs: [preflight, image, native-publish]
        # npm trusted publishing requires a GitHub-hosted runner.
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22.19.0"
                  registry-url: "https://registry.npmjs.org"

            - name: Install trusted-publishing npm version
              run: npm install -g npm@11.9.0

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: sdk-package
                  path: dist-tarballs

            - name: Publish to npm
              env:
                  RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
              run: |
                  OBSERVER_VERSION=$(node -p 'require("./packages/observer-ui/package.json").version')
                  if npm view "durable-actors-observer@$OBSERVER_VERSION" version >/dev/null 2>&1; then
                      echo "durable-actors-observer@$OBSERVER_VERSION already published"
                  else
                      npm publish ./dist-tarballs/durable-actors-observer-$OBSERVER_VERSION.tgz --access public
                  fi
                  if npm view "durable-actors@$RELEASE_VERSION" version >/dev/null 2>&1; then
                      echo "durable-actors@$RELEASE_VERSION already published"
                  else
                      npm publish ./dist-tarballs/durable-actors-$RELEASE_VERSION.tgz --access public
                  fi

    crate:
        name: Publish crate
        needs: [preflight, image, native-publish]
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 30
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}

            - name: Install Rust toolchain
              run: rustup toolchain install 1.91.0 --profile minimal && rustup default 1.91.0

            - name: Publish to crates.io
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                  RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
              run: |
                  status=$(curl -sS \
                    --user-agent "durable-actors-release/1.0 (+https://github.com/TerseAI/durable-actors)" \
                    -o /dev/null \
                    -w "%{http_code}" \
                    "https://crates.io/api/v1/crates/durable-actors/$RELEASE_VERSION")
                  if [ "$status" = "200" ]; then
                      echo "durable-actors@$RELEASE_VERSION already published"
                  elif [ "$status" = "404" ]; then
                      # The rust job already verified this tagged source with cargo publish --dry-run.
                      cargo publish --locked --no-verify
                  else
                      echo "::error::crates.io returned HTTP $status"
                      exit 1
                  fi

    python-runtime:
        name: Publish Python native runtime wheels
        needs: [preflight, native, python-ci, image, native-publish]
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: python-runtime-*
                  merge-multiple: true
                  path: dist
            - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
              with:
                  skip-existing: true

    python:
        name: Publish Python SDK
        needs: [preflight, python-ci, image, native-publish, python-runtime]
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: python-package
                  path: dist
            - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
              with:
                  skip-existing: true
