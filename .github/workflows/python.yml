name: Python SDK

on:
    workflow_call:

permissions:
    contents: read

jobs:
    python:
        name: Python ${{ matrix.python }}
        runs-on: blacksmith-4vcpu-ubuntu-2404
        strategy:
            fail-fast: false
            matrix:
                python: ["3.11", "3.13", "3.14"]
        steps:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.2"
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
              with:
                  python-version: ${{ matrix.python }}
                  enable-cache: true
                  cache-dependency-glob: sdk-python/uv.lock
            - name: Install Rust toolchain
              run: rustup toolchain install 1.91.0 --profile minimal && rustup default 1.91.0
            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
              with:
                  shared-key: validation-ubuntu-24.04
            - name: Build native runtime
              run: cargo build --locked
            - name: Install Python dependencies
              working-directory: sdk-python
              run: uv sync --locked --all-extras --no-install-package durable-actors-runtime
            - name: Check source and generated client types
              working-directory: sdk-python
              run: |
                  uv run --no-sync ruff check src tests
                  uv run --no-sync ruff format --check src tests
                  uv run --no-sync mypy src/durable_actors
                  uv run --no-sync pyright
            - name: Test Python actors against the Rust runtime
              working-directory: sdk-python
              env:
                  DURABLE_ACTORS_TEST_RUNTIME: ${{ github.workspace }}/target/debug/durable-actors
              run: uv run --no-sync pytest -q
            - name: Check Bun CLI compatibility with Python projects
              env:
                  DURABLE_ACTORS_TEST_RUNTIME: ${{ github.workspace }}/target/debug/durable-actors
                  DURABLE_ACTORS_TEST_PYTHON: ${{ github.workspace }}/sdk-python/.venv/bin/python
              run: |
                  bun install --frozen-lockfile
                  bun run --bun --cwd sdk build
                  bun run --bun --cwd sdk tsc -p tsconfig.test.json
                  bun test --timeout 60000 ./sdk/.test-dist/tests/cli/python.test.js
            - name: Build distributions
              if: matrix.python == '3.13'
              working-directory: sdk-python
              run: |
                  uv build --no-sources
                  uv run --isolated --no-project --with ./dist/durable_actors-*.whl python - <<'PY'
                  import subprocess
                  import sys
                  from pathlib import Path
                  import durable_actors

                  assert Path(durable_actors.__file__).with_name("py.typed").is_file()
                  result = subprocess.run([sys.executable, "-m", "durable_actors", "--help"], capture_output=True, text=True)
                  assert result.returncode == 1, result
                  assert "Install durable-actors[cli]" in result.stderr, result.stderr
                  assert "Traceback" not in result.stderr, result.stderr
                  PY
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: matrix.python == '3.13'
              with:
                  name: python-package
                  path: sdk-python/dist/*
                  if-no-files-found: error
                  retention-days: 7
