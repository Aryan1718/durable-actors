name: Feature request
description: Suggest an improvement to Durable Actors.
body:
    - type: markdown
      attributes:
          value: |
              Anyone can suggest a feature here; no Linear account is needed. A maintainer will add the corresponding DUR ticket ID during triage. Keep discussing the issue on GitHub.
    - type: textarea
      id: problem
      attributes:
          label: What problem would this solve?
          description: Describe your use case and what is difficult today.
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed behavior
          description: Describe the outcome or API you would like, with an example if helpful.
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Include any workarounds or other approaches you have tried.
