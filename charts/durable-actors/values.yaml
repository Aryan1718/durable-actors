publicUrl: ""
placement:
  zone: ""
storage:
  bucket: ""
  mode: standard
  rapid:
    buckets: []
    placement: all
credentialsSecret: actors-credentials
serviceAccount:
  googleServiceAccount: ""
ingress:
  enabled: false
  className: ""
  tlsSecret: ""
  annotations: {}
replicaCount: 1
actors:
  warm: 0
  # Spares starting at once across controllers, and how often each controller refills pools.
  maxStarting: 32
  refillIntervalMs: 1000
  cpuMillis: 250
  # Unset leaves actor CPU uncapped.
  cpuLimitMillis: null
  memoryMiB: 256
  # Unset matches memoryMiB.
  memoryLimitMiB: null
  # Range a deployment's @Compute may request; unset uses the runtime defaults.
  bounds:
    minCpuMillis: null
    maxCpuMillis: null
    minMemoryMiB: null
    maxMemoryMiB: null
alarms:
  pollIntervalMs: 100
analytics:
  backend: postgres
  clickhouse:
    url: ""
    database: ""
    user: ""
    passwordSecretKey: ""
usage:
  topic: ""
projectLimits:
  enabled: true
  maxActiveActors: 500
  actorStartsPerSecond: 50
  actorStartBurst: 100
postgres:
  maxConnections: 8
redis:
  urlSecretKey: ""
  caSecretKey: ""
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {memory: 1Gi}
images:
  # Release packaging supplies immutable digests for all three images.
  controlPlane:
    repository: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/durable-actors
    digest: ""
  typescript:
    repository: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/durable-actors
    digest: ""
  python:
    repository: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/durable-actors
    digest: ""
sandboxNamespace: ""
nodeSelector: {}
networkPolicy:
  dnsCidrs: []
