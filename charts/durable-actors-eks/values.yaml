publicUrl: ""
placement:
  zone: ""
storage:
  bucket: ""
  region: ""
  # Role the controller assumes with per-actor session policies.
  actorRoleArn: ""
  # One or two S3 Express directory buckets in distinct zones, for example
  # {bucket: actor-logs--use2-az1--x-s3, zone: use2-az1}. Empty keeps Standard persistence.
  express:
    buckets: []
    placement: all
credentialsSecret: actors-credentials
ingress:
  enabled: false
  className: ""
  tlsSecret: ""
  annotations: {}
replicaCount: 1
actors:
  # Ready spares per region; zero starts every actor on demand.
  warm: 0
  cpuMillis: 250
  # Unset leaves actor CPU uncapped.
  cpuLimitMillis: null
  memoryMiB: 256
  # Unset matches memoryMiB.
  memoryLimitMiB: null
alarms:
  pollIntervalMs: 100
organizationLimits:
  enabled: true
  maxActiveActors: 500
  actorStartsPerSecond: 50
  actorStartBurst: 100
postgres:
  maxConnections: 8
redis:
  urlSecretKey: ""
  caSecretKey: ""
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {memory: 1Gi}
images:
  controlPlane:
    repository: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/durable-actors
    digest: ""
  typescript:
    repository: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/durable-actors
    digest: ""
  python:
    repository: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/durable-actors
    digest: ""
sandboxNamespace: ""
nodeSelector: {}
networkPolicy:
  dnsCidrs: []
  # The cluster's IP family: IPv4 or IPv6.
  ipFamily: IPv4
